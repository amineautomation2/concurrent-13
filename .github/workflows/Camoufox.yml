name: Run Camoufox Stealth Script

on:
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  run-stealth:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip' # Caches dependencies to speed up future runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright camoufox
        # If you have a requirements.txt, use: pip install -r requirements.txt

    - name: Install System and Virtual Framebuffer Dependencies
      run: |
        sudo apt-get update
        # xvfb provides a virtual display so the browser can initialize
        sudo apt-get install -y xvfb libgtk-3-0 libx11-xcb1 libasound2t64 libdbus-glib-1-2 libxt6

    - name: Fetch Camoufox Browser Binaries
      run: |
        python -m camoufox fetch

    - name: Run Script inside Virtual Framebuffer
      run: |
        # xvfb-run creates a temporary parallel virtual display for your script
        xvfb-run --server-args="-screen 0 1280x1024x24" python stealth.py
    